name: Build Android APK

# Builds an installable Android APK for the Expo app in mobile/ and publishes it
# to a GitHub Release so it can be downloaded directly from a browser/phone.
#
# The Expo Android template signs `release` builds with the bundled debug
# keystore, so the resulting APK installs on any device with no secrets required.
# Provide an optional EXPO_PUBLIC_GOOGLE_MAPS_API_KEY repo secret to enable the
# live native Google map (otherwise the app shows a styled map preview).

on:
  workflow_dispatch: {}
  push:
    branches:
      - "claude/**"
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      # Map needs no key (MapLibre + OpenStreetMap). Optional style override:
      EXPO_PUBLIC_MAP_STYLE_URL: ${{ secrets.EXPO_PUBLIC_MAP_STYLE_URL }}
      # Optional free Gemini key → auto-enables AI-written itineraries.
      EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
      EXPO_PUBLIC_GEMINI_MODEL: ${{ secrets.EXPO_PUBLIC_GEMINI_MODEL }}
      EXPO_PUBLIC_AI_PROVIDER: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY != '' && 'gemini' || 'mock' }}
      # Optional Foursquare key → real per-venue photos.
      EXPO_PUBLIC_FOURSQUARE_API_KEY: ${{ secrets.EXPO_PUBLIC_FOURSQUARE_API_KEY }}
      # Stamps the build number into the app so testers know which APK they run.
      EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (generate android/)
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK at $APK"
          cp "$APK" "voyage-ai-${{ github.run_number }}.apk"
          echo "path=mobile/voyage-ai-${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voyage-ai-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: "Voyage AI — Android APK (build ${{ github.run_number }})"
          body: |
            📱 **Voyage AI** native Android build.

            **How to install**
            1. Download `voyage-ai-${{ github.run_number }}.apk` below on your Android phone.
            2. Open it — allow "install from unknown sources" if prompted.
            3. Launch **Voyage AI**.

            Runs key-free with a real native map (MapLibre + OpenStreetMap).
            Add an optional `EXPO_PUBLIC_GEMINI_API_KEY` repo secret and re-run to
            enable AI-written itineraries.

            _Built from `${{ github.sha }}`._
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
          make_latest: true
